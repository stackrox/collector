name: AI review

on:
  # DEMONSTRATION ONLY: change this trigger back to `pull_request_target` before
  # merging. Production must load trusted workflow code from the default branch.
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: stackrox/harness-openshell/.github/workflows/pr-review-reusable.yml@3db628a9513db01cdb38f6631db0ac577d4ba111
    with:
      harness-ref: 3db628a9513db01cdb38f6631db0ac577d4ba111
      allow-draft-reviews: true
      openshell-github-app-client-id: ${{ vars.OPENSHELL_GITHUB_APP_CLIENT_ID }}
    secrets: inherit
