name: Tag a new release
run-name: Tag release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: The full release version calculated by Prepare a new release.
        required: true
        type: string
      release-type:
        description: The calculated release type.
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry-run:
        description: Do not push anything
        default: true
        type: boolean
      requested-by:
        description: The user who requested the release.
        type: string

jobs:
  release:
    runs-on: ubuntu-24.04
    if: ${{ !inputs.dry-run }}
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_TYPE: ${{ inputs.release-type }}
      REQUESTED_BY: ${{ inputs.requested-by || github.actor }}
      GH_TOKEN: "${{ secrets.RHACS_BOT_GITHUB_TOKEN }}"

    steps:
      - name: Validate release version
        run: |
          if [[ ! "$VERSION" =~ ^([[:digit:]]+)\.([[:digit:]]+)\.([[:digit:]]+)$ ]]; then
            echo >&2 "Expected a release version in <Major>.<minor>.<patch> format"
            exit 1
          fi
          echo "RELEASE=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}" >> "$GITHUB_ENV"
          echo "PATCH=${BASH_REMATCH[3]}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          token: ${{ secrets.RHACS_BOT_GITHUB_TOKEN }}

      - name: Initialize mandatory git config
        run: |
          git config user.name "$REQUESTED_BY"
          git config user.email noreply@github.com

      - name: Create release branch
        if: inputs.release-type != 'patch'
        run: |
          git checkout master
          git pull --ff-only
          git tag "${RELEASE}.x"
          git checkout -b "release-${RELEASE}"

      - name: Push release branch
        if: inputs.release-type != 'patch'
        run: |
          git push origin "${RELEASE}.x"
          git push --set-upstream origin "release-${RELEASE}"

      - name: Create release tag
        run: |
          git checkout "release-${RELEASE}"
          if [[ "${RELEASE_TYPE}" == "patch" ]]; then
            git pull --ff-only
          fi
          git tag -a -m "Collector v${RELEASE}.${PATCH} release" "${RELEASE}.${PATCH}"

      - name: Push release tag
        run: |
          git push origin "${RELEASE}.${PATCH}"

      - name: Create tag in falcosecurity-libs
        run: |
          git submodule update --init falcosecurity-libs
          cd falcosecurity-libs/
          git tag "${RELEASE}.${PATCH}"

      - name: Push tag in falcosecurity-libs
        run: |
          cd falcosecurity-libs/
          git push origin "${RELEASE}.${PATCH}"
